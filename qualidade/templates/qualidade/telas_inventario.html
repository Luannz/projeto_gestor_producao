<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Produção do Dia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #254072ff 0%, #33548dff 100%);
            min-height: 100vh;
            padding: 30px;
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.5s ease-in;
        }
        
        .header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-size: 24px;
            margin-top: 20px;
        }

        .data-badge {
            background: rgba(255,255,255,0.2);
            padding: 12px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn.btn-secondary.display-mode {
            border-radius: 50px
        }
        
        .total-geral-badge {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .voltar-badge {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            opacity: 0.5;
        }

        /* Seletor de Data Sutil */
        .date-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.3;
            transition: all 0.3s ease;
        }
        
        .date-selector:hover {
            opacity: 1;
            background: rgba(255,255,255,0.2);
        }
        
        .date-selector label {
            font-size: 14px;
            font-weight: 600;
        }
        
        .date-selector input {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255,255,255,0.9);
            color: #1e3c72;
            font-weight: 600;
        }
        
        .date-selector button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #1e3c72;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .date-selector button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        /* Container do Gráfico */
        .grafico-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in;
            max-width: 1600px;
            margin: 0 auto;
        }

        #graficoProducao {
            max-height: 70vh;
        }
        
        /* Grid de Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 15px;
            animation: fadeIn 0.8s ease-in;
        }
        
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            color: #1e3c72;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.3s ease; 
        }
        
        .card-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        
        .card-nome {
            font-size: 32px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .card-operador {
            font-size: 18px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .partes-lista {
            margin-top: 20px;
        }
        
        .parte-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f3f4f6;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        
        .parte-item:hover {
            background: #e5e7eb;
            transform: translateX(5px);
        }
        
        .parte-nome {
            font-size: 20px;
            font-weight: 600;
            color: #374151;
        }
        
        .parte-quantidade {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            padding: 8px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        
        .card-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .total-label {
            font-size: 18px;
            font-weight: 600;
            color: #6b7280;
        }
        
        .total-valor {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            animation: fadeIn 1s ease-in;
        }
        
        .empty-icon {
            font-size: 120px;
            margin-bottom: 30px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 32px;
            opacity: 0.8;
        }
        
        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Auto-refresh indicator */
        .refresh-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0.5;
        }
        
        /* Responsivo para telas menores */
        @media (max-width: 1400px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 32px;
            }
            
            .header-info {
                flex-direction: column;
                gap: 15px;
                font-size: 18px;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            .card-nome {
                font-size: 24px;
            }
        }

        /* Estilo especial para TVs grandes (Full HD ou superiores) */
        @media (min-width: 1800px) {
            body {
                padding: 60px;
            }

            .fichas-grid {
                grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
                gap: 40px;
            }

            .ficha-card {
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                transform: scale(1.05);
                transition: transform 0.3s ease;
            }

            .ficha-card:hover {
                transform: scale(1.08);
            }

            .ficha-title {
                font-size: 36px;
                font-weight: 800;
            }

            .ficha-info {
                font-size: 22px;
                color: #374151;
            }

            .ficha-badge {
                font-size: 22px;
                padding: 12px 24px;
            }

            .btn {
                font-size: 20px;
                padding: 14px 28px;
                border-radius: 12px;
            }

            .ficha-actions {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="date-selector">
        <form method="get" style="display: flex; gap: 10px;">
            <input type="date" name="data" value="{{ data_selecionada|date:'Y-m-d' }}">
            <button type="submit" style="cursor:pointer">Buscar</button>
        </form>
    </div>

    <div class="header">
        <h1>📦 Dashboard de Inventário</h1>
        <div class="header-info">
            <div>
                <a href="{% url 'telas' %}" class="voltar-badge btn btn-secondary">Produção</a>   
            </div>
            
            <div class="total-geral-badge">
                <span>⚠️ {{ total_avulsos }} Pés Avulsos no Total</span>
            </div>

            <div class="data-badge">
                <span>📅 Movimentação: {{ data_selecionada|date:"d/m/Y" }}</span>
            </div>
            
            <div>
                <a href="{% url 'home' %}" class="voltar-badge btn btn-secondary">← Voltar</a>
            </div>
        </div>
    </div>

    <div class="grafico-container">
        <div style="flex: 1.5; min-width: 500px; background: white; padding: 20px; border-radius: 15px;">
            <canvas id="graficoEstoque"></canvas>
        </div>
        
        <div style="flex: 1; min-width: 400px; background: white; padding: 20px; border-radius: 15px;">
            <canvas id="graficoSaidas"></canvas>
        </div>
    </div>

<script>
    // 1. GRÁFICO DE ESTOQUE (Top 10 Modelos)
    // Aqui usamos 'pares_formados' e 'total_avulsos' que vêm do annotate da view
    const ctxEstoque = document.getElementById('graficoEstoque').getContext('2d');
    new Chart(ctxEstoque, {
        type: 'bar', 
        data: {
            labels: [{% for i in top_estoque %}'{{ i.modelo__nome }}',{% endfor %}],
            datasets: [
                {
                    label: 'Pares Formados (Completos)',
                    data: [{% for i in top_estoque %}{{ i.pares_formados }},{% endfor %}],
                    backgroundColor: '#10b981', // Verde
                    borderRadius: 5,
                },
                {
                    label: 'Pés Avulsos (Sem Par)',
                    data: [{% for i in top_estoque %}{{ i.total_avulsos }},{% endfor %}],
                    backgroundColor: '#f43f5e', // Rosa/Vermelho
                    borderRadius: 5,
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: { stacked: true }, // Barras empilhadas para mostrar o total de peças
                y: { stacked: true, beginAtZero: true }
            },
            plugins: {
                title: { 
                    display: true, 
                    text: 'ESTOQUE REAL: PARES COMPLETOS vs. AVULSOS',
                    font: { size: 20, weight: 'bold' },
                    padding: 20
                },
                legend: { position: 'bottom' }
            }
        }
    });

    // 2. GRÁFICO DE SAÍDAS (O que mais saiu na data selecionada)
    const ctxSaidas = document.getElementById('graficoSaidas').getContext('2d');
    new Chart(ctxSaidas, {
        type: 'bar',
        data: {
            labels: [{% for i in top_saidas %}'{{ i.identificacao_item|truncatechars:12 }}',{% endfor %}],
            datasets: [{
                label: 'Qtd Saída',
                data: [{% for i in top_saidas %}{{ i.total }},{% endfor %}],
                backgroundColor: '#3b82f6', // Azul
                borderColor: '#2563eb',
                borderWidth: 1
            }]
        },
        options: {
            indexAxis: 'y', // Barra horizontal
            plugins: {
                title: { 
                    display: true, 
                    text: 'SAÍDAS DO DIA (RANKING)',
                    font: { size: 18 }
                }
            }
        }
    });

    // Auto-refresh a cada 60 segundos
    setTimeout(() => location.reload(), 60000);
</script>
</body>
</html>
